[project]
name = "lite-thinking-domain"
version = "0.1.0"
description = "Capa de dominio desacoplada (Arquitectura Limpia) para la prueba tecnica Lite Thinking 2026. Sin dependencias de Django/FastAPI/HTTP."
authors = [
    {name = "Lite Thinking 2026 Candidate"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
]

[tool.poetry]
packages = [
    { include = "lite_thinking_domain", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
